name: publish

on:
  issues:
    types: [labeled, closed, reopened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: geo-data
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'geo')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 3. 발행 — 승인된 글 올리기
        if: github.event.action == 'labeled' && github.event.label.name == '승인'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python publish.py ${{ github.event.issue.number }}
      - name: 대시보드 데이터 정리
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync_issues.py
      - name: 저장
        if: always()
        run: |
          git config user.name "geo-bot"
          git config user.email "geo-bot@users.noreply.github.com"
          git add docs/data
          git commit -m "초안 상태 갱신 #${{ github.event.issue.number }}" || exit 0
          git pull --rebase -X theirs && git push
